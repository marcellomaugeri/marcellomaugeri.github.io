<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 200 200'>
  <defs>
    <pattern id="cyberPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Dark cyber background -->
      <rect fill='#0a0a0a' width='80' height='80'/>
      
      <!-- Neon grid lines -->
      <path d="M0 20 L80 20 M0 40 L80 40 M0 60 L80 60" 
            stroke='#00ff41' stroke-width='0.5' opacity='0.6'/>
      <path d="M20 0 L20 80 M40 0 L40 80 M60 0 L60 80" 
            stroke='#00ff41' stroke-width='0.5' opacity='0.6'/>
      
      <!-- Digital squares/pixels -->
      <rect x='18' y='18' width='4' height='4' fill='#00ff41' opacity='0.8'/>
      <rect x='38' y='38' width='4' height='4' fill='#ff0080' opacity='0.8'/>
      <rect x='58' y='18' width='4' height='4' fill='#00ccff' opacity='0.8'/>
      <rect x='18' y='58' width='4' height='4' fill='#ff0080' opacity='0.8'/>
      <rect x='58' y='58' width='4' height='4' fill='#00ff41' opacity='0.8'/>
      
      <!-- Binary code effect -->
      <text x='5' y='15' font-family='monospace' font-size='6' fill='#00ff41' opacity='0.3'>1</text>
      <text x='25' y='15' font-family='monospace' font-size='6' fill='#00ff41' opacity='0.3'>0</text>
      <text x='45' y='15' font-family='monospace' font-size='6' fill='#00ff41' opacity='0.3'>1</text>
      <text x='65' y='15' font-family='monospace' font-size='6' fill='#00ff41' opacity='0.3'>1</text>
      
      <text x='5' y='75' font-family='monospace' font-size='6' fill='#ff0080' opacity='0.3'>0</text>
      <text x='25' y='75' font-family='monospace' font-size='6' fill='#ff0080' opacity='0.3'>1</text>
      <text x='45' y='75' font-family='monospace' font-size='6' fill='#ff0080' opacity='0.3'>0</text>
      <text x='65' y='75' font-family='monospace' font-size='6' fill='#ff0080' opacity='0.3'>0</text>
      
      <!-- Glitch lines -->
      <rect x='0' y='35' width='80' height='1' fill='#ff0080' opacity='0.7'/>
      <rect x='0' y='37' width='30' height='1' fill='#00ccff' opacity='0.5'/>
      <rect x='50' y='37' width='30' height='1' fill='#00ccff' opacity='0.5'/>
      
      <!-- Matrix-style falling elements -->
      <rect x='10' y='5' width='1' height='8' fill='#00ff41' opacity='0.4'/>
      <rect x='30' y='25' width='1' height='6' fill='#00ff41' opacity='0.4'/>
      <rect x='50' y='45' width='1' height='10' fill='#00ff41' opacity='0.4'/>
      <rect x='70' y='65' width='1' height='5' fill='#00ff41' opacity='0.4'/>
    </pattern>
  </defs>

  <rect fill="url(#cyberPattern)" width="200" height="200"/>
</svg>